# docker-compose.yml
# -------------------
version: '3.9'

services:
  web:
    build: .
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:123456@db:5432/task_service
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: task_service
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: